[tools]
rust = { version = "1.99.0", components = "clippy,rustfmt" }

[tasks.build]
run = "cargo build --release"

[tasks.check]
run = ["cargo fmt --check", "cargo clippy -- -D warnings"]

[tasks.format]
run = ["cargo fmt", "cargo clippy -- -D warnings"]

[tasks.lint]
run = ["cargo clippy -- -D warnings"]

[tasks.install]
description = "Install the release binary to ~/.local/bin and restart gpg-agent (does not touch gpg-agent.conf)"
depends = ["build"]
run = [
  "install -m 755 target/release/scdaemon-touch-proxy ~/.local/bin/scdaemon-touch-proxy",
  "gpgconf --kill gpg-agent",
]
